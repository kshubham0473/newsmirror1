name: Cluster articles

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours — flips & beats appear same-window as the news
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

jobs:
  cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cluster phase
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/cluster_response.json -w "%{http_code}" -X POST \
            --max-time 120 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=cluster" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/cluster_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Cluster edge function returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # Framing analysis right after clustering (was daily-only, which starved
      # flip cards of fresh insights — new clusters waited up to 24h)
      - name: Analyse cluster framing
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /tmp/analyze_response.json -w "%{http_code}" -X POST \
            --max-time 150 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=analyze-clusters" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/analyze_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::analyze-clusters returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # "What changed" beats — powers the catch-up delta card. Cheap: only
      # clusters that gained articles since their last beat get one 70B call.
      - name: Beat clusters
        continue-on-error: true
        run: |
          sleep 30
          HTTP_STATUS=$(curl -s -o /tmp/beats_response.json -w "%{http_code}" -X POST \
            --max-time 150 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=beat-clusters" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/beats_response.json
