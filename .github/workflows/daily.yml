name: NewsMirror daily analysis

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC daily (7:30 AM IST) — after overnight ingest has run
  workflow_dispatch:

permissions:
  issues: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      # Profile sources: classify top political articles per source to build
      # high-quality ideology profiles. Only political/policy articles are used —
      # sports and lifestyle are noise. Rotates through sources daily.
      - name: Profile sources
        id: profile_call
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/profile_response.json -w "%{http_code}" -X POST \
            --max-time 120 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=profile-sources" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/profile_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::profile-sources phase returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # Analyse framing divergence for clusters with 3+ outlets.
      # Detects when different outlets frame the same event in meaningfully
      # different ways (e.g. "Women reservation bill" vs "Delimitation bill").
      - name: Analyse cluster framing
        id: analyze_call
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/analyze_response.json -w "%{http_code}" -X POST \
            --max-time 120 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=analyze-clusters" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/analyze_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::analyze-clusters phase returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # ── Threads pipeline: detect (free heuristics) → curate (1 LLM call) →
      #    synthesize (living briefs + time-spine beats). 60s gaps let the
      #    Groq 70B token window refill between judgment calls.
      - name: Detect threads
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/detect_response.json -w "%{http_code}" -X POST \
            --max-time 120 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=detect-threads" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/detect_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::detect-threads phase returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Curate threads
        run: |
          sleep 60
          HTTP_STATUS=$(curl -s -o /tmp/curate_response.json -w "%{http_code}" -X POST \
            --max-time 120 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=curate-threads" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/curate_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::curate-threads phase returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Synthesize threads
        run: |
          sleep 60
          HTTP_STATUS=$(curl -s -o /tmp/synth_response.json -w "%{http_code}" -X POST \
            --max-time 150 \
            "${{ secrets.SUPABASE_URL }}/functions/v1/ingest-articles?phase=synthesize-threads" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/synth_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::synthesize-threads phase returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Daily analysis workflow failed — ${new Date().toISOString().slice(0,16).replace('T',' ')} UTC`;
            const body = [
              '**Workflow:** NewsMirror daily analysis',
              `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              'One of the daily analysis phases failed.',
              '',
              '**Checklist**',
              '- [ ] Check Supabase Edge Function logs for `ingest-articles`',
              '- [ ] Verify Gemini API key is valid and quota not exceeded',
              '- [ ] `profile-sources`: check that articles have topic_tags set (classify phase must have run)',
              '- [ ] `analyze-clusters`: check that clusters have 3+ distinct sources with summaries',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ops', 'alert'],
            });
